<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Voice Changer">
  <title>Voice Changer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Voice Changer</h1>
      <p id="preflight-status" class="status">Checking hardware…</p>
    </header>

    <section class="card">
      <div class="model-inputs">
        <label>ContentVec / HuBERT ONNX <input id="contentvec-model" type="file" accept=".onnx,application/octet-stream"></label>
        <label>RMVPE ONNX <input id="rmvpe-model" type="file" accept=".onnx,application/octet-stream"></label>
        <label>RVC ONNX <input id="rvc-model" type="file" accept=".onnx,application/octet-stream"></label>
      </div>
      <div class="buttons">
        <button id="load-models" type="button">Load models</button>
        <button id="clear-model-cache" type="button" class="secondary">Clear cache</button>
      </div>
      <pre id="model-status">No models loaded.</pre>
    </section>

    <section class="card">
      <h2>Real-time conversion</h2>
      <div class="settings-grid">
        <label>Pitch shift <input id="pitch-shift" type="number" min="-24" max="24" step="1" value="0"></label>
        <label>Speaker ID <input id="speaker-id" type="number" min="0" step="1" value="0"></label>
        <label>Model sample rate
          <select id="model-sample-rate">
            <option value="32000">32 kHz</option>
            <option value="40000" selected>40 kHz</option>
            <option value="48000">48 kHz</option>
          </select>
        </label>
        <label>Inference chunk
          <select id="chunk-ms">
            <option value="160">160 ms</option>
            <option value="240">240 ms</option>
            <option value="320" selected>320 ms</option>
            <option value="480">480 ms</option>
          </select>
        </label>
      </div>
      <div class="buttons">
        <button id="start-audio" type="button">Start</button>
        <button id="stop-audio" type="button" class="secondary" disabled>Stop</button>
      </div>
      <p id="audio-status" class="status">Audio stopped.</p>
    </section>
  </main>

  <footer id="resource-footer">
    <strong>Checking hardware…</strong>
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
