name: Front-end CI

on:
    pull_request:
        paths:
            - ".github/workflows/frontend.yml"
            - ".gitmodules"
            - "pages.config.ts"
            - "scripts/check-frontend.ts"
            - "vendor/pages"
            - "client/demo/**"
    push:
        branches:
            - local-rmvpe-onnx
        paths:
            - ".github/workflows/frontend.yml"
            - ".gitmodules"
            - "pages.config.ts"
            - "scripts/check-frontend.ts"
            - "vendor/pages"
            - "client/demo/**"

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Check pinned Pages contract
              run: bun vendor/pages/src/cli.ts check pages.config.ts

            - name: Check front-end standards
              run: bun scripts/check-frontend.ts

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: client/demo/package-lock.json

            - name: Install front-end dependencies
              working-directory: client/demo
              run: npm ci

            - name: Build front end
              working-directory: client/demo
              run: npm run build:prod
